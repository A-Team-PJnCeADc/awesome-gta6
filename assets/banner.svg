<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="Awesome GTA VI Reverse Engineering Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090C15"/>
      <stop offset="55%" stop-color="#0E1324"/>
      <stop offset="100%" stop-color="#13162D"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="18%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#FF3B9A" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#FF3B9A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="85%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B9A"/>
      <stop offset="50%" stop-color="#FFB84D"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="titleGrad" gradientUnits="userSpaceOnUse" x1="415" y1="0" x2="625" y2="0">
      <stop offset="0%" stop-color="#FF3B9A"/>
      <stop offset="50%" stop-color="#FFB84D"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8FA8D6" stroke-width="0.6" stroke-opacity="0.08"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="2" y="2" width="1276" height="376" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1280" height="380" fill="url(#bgGrad)"/>
    <rect width="1280" height="380" fill="url(#grid)"/>
    <rect width="1280" height="380" fill="url(#glowPink)"/>
    <rect width="1280" height="380" fill="url(#glowCyan)"/>

    <!-- Top accent bar -->
    <rect x="0" y="0" width="1280" height="4" fill="url(#neonBar)"/>

    <!-- Left subtle telemetry strip -->
    <g opacity="0.38" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#64748B">
      <text x="24" y="70">0x52504639</text>
      <text x="24" y="130">TTPF.BC7</text>
      <text x="24" y="190">ADAT.OPUS</text>
      <text x="24" y="250">GFX10.3</text>
      <text x="24" y="310">SPIR-V</text>
    </g>
    <line x1="106" y1="44" x2="106" y2="336" stroke="#222C4A" stroke-width="1"/>

    <!-- Eyebrow label -->
    <circle cx="136" cy="76" r="4.5" fill="#00E5FF"/>
    <text x="150" y="80" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="2" fill="#00E5FF">
      CURATED INDEX  //  OPEN-SOURCE &amp; CLEAN-ROOM
    </text>

    <!-- Main Title -->
    <text x="132" y="152" font-family="'Avenir Next', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="800" letter-spacing="0.5" fill="#F8FAFC">
      AWESOME <tspan fill="url(#titleGrad)">GTA VI</tspan> RE
    </text>

    <!-- Subtitle -->
    <text x="134" y="196" font-family="'Avenir Next', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18.5" font-weight="500" fill="#B8C4DB">
      RAGE 9  ·  RPF9  ·  TTPF &amp; BCPack  ·  ADAT / AWC  ·  RDNA2 -&gt; SPIR-V  ·  Scarlett
    </text>

    <!-- Divider -->
    <rect x="134" y="224" width="698" height="2.5" rx="1.25" fill="url(#neonBar)" opacity="0.9"/>

    <!-- Category Pills -->
    <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600">
      <rect x="134" y="258" width="164" height="36" rx="18" fill="#11192E" stroke="#00E5FF" stroke-opacity="0.55" stroke-width="1.2"/>
      <circle cx="154" cy="276" r="4" fill="#00E5FF"/>
      <text x="167" y="280.5" fill="#E2E8F0">RPF9 EXPLORERS</text>

      <rect x="310" y="258" width="160" height="36" rx="18" fill="#11192E" stroke="#FF3B9A" stroke-opacity="0.55" stroke-width="1.2"/>
      <circle cx="330" cy="276" r="4" fill="#FF3B9A"/>
      <text x="343" y="280.5" fill="#E2E8F0">TTPF &amp; AUDIO</text>

      <rect x="482" y="258" width="164" height="36" rx="18" fill="#11192E" stroke="#FFB84D" stroke-opacity="0.55" stroke-width="1.2"/>
      <circle cx="502" cy="276" r="4" fill="#FFB84D"/>
      <text x="515" y="280.5" fill="#E2E8F0">RECOMP &amp; SHIMS</text>

      <rect x="658" y="258" width="142" height="36" rx="18" fill="#11192E" stroke="#2EE59D" stroke-opacity="0.55" stroke-width="1.2"/>
      <circle cx="678" cy="276" r="4" fill="#2EE59D"/>
      <text x="691" y="280.5" fill="#E2E8F0">FORMAT DOCS</text>
    </g>

    <!-- Footer micro-line -->
    <text x="134" y="332" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#64748B">
      No game binaries, encryption keys, or copyrighted dumps indexed.
    </text>

    <!-- Right-side Pipeline Card -->
    <g transform="translate(882, 48)">
      <rect x="0" y="0" width="356" height="284" rx="14" fill="#0D1221" stroke="#243052" stroke-width="1.5"/>
      <rect x="0" y="0" width="356" height="34" rx="14" fill="#131A2E"/>
      <rect x="0" y="20" width="356" height="14" fill="#131A2E"/>
      <circle cx="20" cy="17" r="4.5" fill="#FF3B9A"/>
      <circle cx="35" cy="17" r="4.5" fill="#FFB84D"/>
      <circle cx="50" cy="17" r="4.5" fill="#2EE59D"/>
      <text x="72" y="21" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#94A3B8">
        rage9-stack.pipeline
      </text>

      <!-- Node 1 -->
      <rect x="20" y="52" width="316" height="44" rx="8" fill="#141C33" stroke="#00E5FF" stroke-opacity="0.45" stroke-width="1"/>
      <circle cx="38" cy="74" r="4" fill="#00E5FF"/>
      <text x="52" y="70" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#F1F5F9">RPF9 / TTPF / ADAT / BK2</text>
      <text x="52" y="86" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="11" fill="#8EA2C5">Archives, tiled textures, Opus/XMA2, video</text>

      <line x1="178" y1="96" x2="178" y2="112" stroke="#3B4D7A" stroke-width="1.5"/>
      <polygon points="174,109 182,109 178,115" fill="#00E5FF"/>

      <!-- Node 2 -->
      <rect x="20" y="116" width="316" height="44" rx="8" fill="#141C33" stroke="#FF3B9A" stroke-opacity="0.45" stroke-width="1"/>
      <circle cx="38" cy="138" r="4" fill="#FF3B9A"/>
      <text x="52" y="134" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#F1F5F9">EXPLORERS &amp; DECODERS</text>
      <text x="52" y="150" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="11" fill="#8EA2C5">PercyStar · SixNG · rpf9-explorer · ttpf-studio</text>

      <line x1="178" y1="160" x2="178" y2="176" stroke="#3B4D7A" stroke-width="1.5"/>
      <polygon points="174,173 182,173 178,179" fill="#FFB84D"/>

      <!-- Node 3 -->
      <rect x="20" y="180" width="316" height="44" rx="8" fill="#141C33" stroke="#FFB84D" stroke-opacity="0.45" stroke-width="1"/>
      <circle cx="38" cy="202" r="4" fill="#FFB84D"/>
      <text x="52" y="198" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#F1F5F9">RDNA2 -&gt; SPIR-V / DXIL</text>
      <text x="52" y="214" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-size="11" fill="#8EA2C5">Leonida · OpenScarlett · Shader lifters</text>

      <line x1="178" y1="224" x2="178" y2="236" stroke="#3B4D7A" stroke-width="1.5"/>
      <polygon points="174,233 182,233 178,239" fill="#2EE59D"/>

      <!-- Node 4 -->
      <rect x="20" y="240" width="316" height="32" rx="7" fill="#102527" stroke="#2EE59D" stroke-opacity="0.55" stroke-width="1"/>
      <circle cx="38" cy="256" r="4" fill="#2EE59D"/>
      <text x="52" y="260" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#A7F3D0">WIN / MACOS / LINUX HOST RUNTIME</text>
    </g>
  </g>

  <rect x="2" y="2" width="1276" height="376" rx="20" fill="none" stroke="#243052" stroke-width="1.5"/>
</svg>
