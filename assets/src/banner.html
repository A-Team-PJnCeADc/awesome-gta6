<!doctype html>
<!-- README hero. Rendered to assets/banner.png by render.py (1280x400 CSS px @2x).
     Deliberately plain: the photo, one condensed typeface, one accent colour. No gradients, chips or grain. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=IBM+Plex+Sans:wght@500;600&display=block">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; -webkit-font-smoothing: antialiased; }
  body { width: 1280px; }

  .card {
    position: relative;
    width: 1280px;
    height: 400px;
    border-radius: 10px;
    overflow: hidden;
    background: #0b0d1a url("sunset.jpg") center 42% / cover no-repeat;
  }
  .tag {
    position: absolute; left: 58px; top: 40px;
    font: 600 14px/1 "IBM Plex Sans", sans-serif;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(255,255,255,0.7);
  }
  .t { position: absolute; left: 56px; bottom: 42px; color: #fff; }
  h1 { font: 700 104px/0.98 "Oswald", sans-serif; text-transform: uppercase; }
  h1 span { color: #ff9a4d; }
  p { margin-top: 20px; font: 500 19px/1.3 "IBM Plex Sans", sans-serif; color: rgba(255,255,255,0.84); }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">Awesome list</div>
    <div class="t">
      <h1>GTA <span>VI</span> Reverse<br>Engineering</h1>
      <p>Open-source tools, decoders and format docs for Rockstar's RAGE 9 engine.</p>
    </div>
  </div>
</body>
</html>
