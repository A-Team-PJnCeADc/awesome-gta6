<!doctype html>
<!--
  GitHub social preview (Settings > General > Social preview).
  Rendered to assets/social-preview.png at exactly 1280x640 by render.py.
  Deliberately plain to match banner.html: photo, flat colours, one typeface per job.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=IBM+Plex+Sans:wght@500;600&family=IBM+Plex+Mono:wght@500&display=block">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #17132e; -webkit-font-smoothing: antialiased; }
  body { width: 1280px; height: 640px; }

  .card {
    position: relative;
    width: 1280px;
    height: 640px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: #17132e;
  }

  .hero {
    position: relative;
    flex: 1;
    background: #0b0d1a url("sunset.jpg") right 44% / cover no-repeat;
  }

  .tag {
    position: absolute;
    left: 68px;
    top: 56px;
    font: 600 16px/1 "IBM Plex Sans", sans-serif;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.72);
  }

  .title-block {
    position: absolute;
    left: 64px;
    bottom: 54px;
    color: #fff;
    max-width: 960px;
  }

  h1 {
    font: 700 128px/0.95 "Oswald", sans-serif;
    text-transform: uppercase;
    letter-spacing: -0.005em;
  }
  h1 span { color: #ff9a4d; }

  p {
    margin-top: 26px;
    font: 500 23px/1.35 "IBM Plex Sans", sans-serif;
    color: rgba(255, 255, 255, 0.86);
  }

  .bar {
    height: 58px;
    padding: 0 68px;
    background: #17132e;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font: 500 15px/1 "IBM Plex Mono", ui-monospace, monospace;
    color: rgba(255, 255, 255, 0.78);
  }
  .bar .topics b { font-weight: 500; color: #f7ab47; }
  .bar .url { color: rgba(255, 255, 255, 0.62); }
</style>
</head>
<body>
  <div class="card">
    <div class="hero">
      <div class="tag">Awesome list · Clean-room · Open source</div>
      <div class="title-block">
        <h1>GTA <span>VI</span> Reverse<br>Engineering</h1>
        <p>Open-source tools, decoders and format docs for Rockstar's RAGE 9 engine.</p>
      </div>
    </div>
    <div class="bar">
      <div class="topics"><b>RPF9</b> · TTPF · ADAT / AWC · BK2 · RDNA2 → SPIR-V</div>
      <div class="url">Ahmet-Dedeler/awesome-gta6-reverse-engineering</div>
    </div>
  </div>
</body>
</html>
